<template id="main-loader">
  <div class="spinner-container">
    <div class="spinner"></div>
    <p>Loading Module...</p>
  </div>
</template>
<single-spa-router>
  <!--

    This is the single-spa Layout Definition for your microfrontends.
    See https://single-spa.js.org/docs/layout-definition/ for more information.

  -->

  <!-- Example layouts you might find helpful:

  <nav>
    <application name="@org/navbar"></application>
  </nav>
  <route path="settings">
    <application name="@org/settings"></application>
  </route>

  -->

  <div id="single-spa-layout-root">
    <route path="auth">
      <application name="@NovaOrg/nova-mfe-auth"></application>
    </route>

    <route default>
      <application name="@NovaOrg/nova-mfe-shared-layout"></application>

      <main>
        <route path="dashboard">
          <application name="@NovaOrg/nova-mfe-dashboard" loader="main-loader"></application>
        </route>
        <route path="recruitment">
          <application name="@NovaOrg/nova-mfe-recruitment" loader="main-loader"></application>
        </route>
        <route path="payroll">
          <application name="@NovaOrg/nova-mfe-payroll" loader="main-loader"></application>
        </route>
        <route path="schedule">
          <application name="@NovaOrg/nova-mfe-schedule" loader="main-loader"></application>
        </route>
      </main>
    </route>
  </div>
</single-spa-router>
