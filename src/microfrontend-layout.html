<single-spa-router>
  <!--

    This is the single-spa Layout Definition for your microfrontends.
    See https://single-spa.js.org/docs/layout-definition/ for more information.

  -->

  <!-- Example layouts you might find helpful:

  <nav>
    <application name="@org/navbar"></application>
  </nav>
  <route path="settings">
    <application name="@org/settings"></application>
  </route>

  -->

  <div id="single-spa-layout-root">
    <route path="auth">
      <application name="@NovaOrg/nova-mfe-auth"></application>
    </route>

    <route default>
      <application name="@NovaOrg/nova-mfe-shared-layout"></application>

      <route path="dashboard">
        <application name="@NovaOrg/nova-mfe-dashboard"></application>
      </route>
      <route path="recruitment">
        <application name="@NovaOrg/nova-mfe-recruitment"></application>
      </route>
    </route>
  </div>
</single-spa-router>
